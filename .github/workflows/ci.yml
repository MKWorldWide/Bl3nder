name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default environment variables
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      # Python setup with caching
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'
      
      # Node.js setup with caching
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        if: contains(needs.setup.outputs.has_package_json, 'true')
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort
      
      # Install Node.js dependencies if package.json exists
      - name: Install Node.js dependencies
        if: contains(needs.setup.outputs.has_package_json, 'true')
        run: npm ci
      
      # Linting
      - name: Lint Python with flake8
        run: |
          flake8 . --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Format Python with black
        run: |
          black --check --diff .
      
      - name: Lint Node.js
        if: contains(needs.setup.outputs.has_package_json, 'true')
        run: npx eslint . --max-warnings=0
      
      # Testing
      - name: Run Python tests
        run: |
          python -m pytest \
            --maxfail=1 \
            --disable-warnings \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov
      
      - name: Run Node.js tests
        if: contains(needs.setup.outputs.has_package_json, 'true')
        run: npm test -- --coverage
      
      # Upload coverage reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**/*
            htmlcov/
          retention-days: 7
  
  # Add more jobs as needed (e.g., build, deploy, etc.)
  # build:
  #   needs: lint-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build
  #       run: |
  #         # Add build commands here
          
  # Setup job to determine which jobs to run
  setup:
    runs-on: ubuntu-latest
    outputs:
      has_package_json: ${{ steps.check_package_json.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check_package_json
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
