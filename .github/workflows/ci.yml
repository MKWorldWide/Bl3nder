name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# Default environment variables
env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  # Cache configuration
  CACHE_VERSION: 'v1'
  PIP_CACHE_DIR: ~/.cache/pip
  NODE_CACHE_DIR: ~/.npm

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # Enable security vulnerability scanning
          persist-credentials: false
      
      # Python setup with improved caching
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'
      
      # Node.js setup with improved caching
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      
      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1
      
      # Cache pip packages
      - name: Cache pip packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ env.CACHE_VERSION }}-
            ${{ runner.os }}-pip-
      
      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install flake8 black isort bandit safety
      
      # Security scanning
      - name: Run Python security scan
        run: |
          bandit -r . -x tests -lll --recursive
          safety check --full-report
      
      # Linting
      - name: Lint Python with flake8
        run: |
          flake8 . --select=E9,F63,F7,F82 --show-source --statistics
          black --check --diff .
          isort --check-only --diff .
      
      # Node.js dependencies and linting
      - name: Install Node.js dependencies
        run: |
          npm ci --prefer-offline --no-audit
          
      - name: Run Node.js security audit
        run: |
          npm audit --production
          
      - name: Lint Node.js
        run: |
          npx eslint . --max-warnings=0
      
      # Testing with coverage
      - name: Run Python tests
        run: |
          python -m pytest \
            --maxfail=1 \
            --disable-warnings \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit/test-results.xml
      
      - name: Run Node.js tests
        run: |
          npm test -- --coverage --watchAll=false
      
      # Upload coverage reports
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true
      
      # Upload test artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**/*
            htmlcov/
            junit/
          retention-days: 7
      
      # Upload build artifacts for debugging
      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/*.log
            **/build/**/*.log
          retention-days: 3
      
      # Performance monitoring
      - name: Run performance tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python -m pytest tests/performance/ -v --benchmark-only --benchmark-json=benchmark.json
      
      - name: Upload benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30
  
  # Add more jobs as needed (e.g., build, deploy, etc.)
  # build:
  #   needs: lint-and-test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build
  #       run: |
  #         # Add build commands here
          
  # Setup job to determine which jobs to run
  setup:
    runs-on: ubuntu-latest
    outputs:
      has_package_json: ${{ steps.check_package_json.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check_package_json
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
