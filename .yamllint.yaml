# YAML lint configuration
# For more information, see: https://yamllint.readthedocs.io/

# Extend the default configuration
extends: default

# Customize rules
rules:
  # Indentation
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  # Line length
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # Trailing spaces
  trailing-spaces: enable

  # Empty lines
  empty-lines:
    max: 1
    max-start: 1
    max-end: 1

  # Comments
  comments:
    require-starting-space: true
    min-spaces-from-content: 1

  # Document start/end
  document-start: disable
  document-end: disable

  # Braces, brackets, and colons
  braces: enable
  brackets: enable
  colons: enable

  # Commas
  commas: enable

  # Empty values
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-block-sequences: false

  # Hyphens
  hyphens:
    max-spaces-after: 1

  # Key duplicates
  key-duplicates: enable

  # New line at end of file
  new-line-at-end-of-file: enable

  # New lines
  new-lines:
    type: unix

  # Truthy
  truthy: disable

# Exclude files and directories
exclude: |
  # Version control
  .git/
  .github/
  .gitignore

  # IDE and editor files
  .vscode/
  .idea/
  *.swp
  *.swo
  *~
  .DS_Store

  # Build artifacts and caches
  build/
  dist/
  node_modules/
  __pycache__/
  *.py[cod]
  *$py.class
  .pytest_cache/
  .mypy_cache/
  .ruff_cache/
  .coverage
  coverage.xml
  *.cover
  .hypothesis/
  .pytest_cache/

  # Virtual environments
  venv/
  env/
  .venv/
  .env
  .env.local
  .env.*.local

  # Logs
  logs
  *.log
  npm-debug.log*
  yarn-debug.log*
  yarn-error.log*
  .yarn/
  .yarnrc.yml

  # Lock files
  package-lock.json
  yarn.lock
  Pipfile.lock
  poetry.lock

  # Local overrides
  .local-*
  local.*
  local_*
  *-local.yaml
  *-local.yml

  # Documentation
  _build/
  site/
  .next/
  .nuxt/
  .svelte-kit/

  # System files
  .DS_Store
  Thumbs.db
  ._*
